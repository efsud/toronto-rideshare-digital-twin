[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toronto-rideshare-digital-twin"
version = "0.1.0"
description = "Traffic-aware Toronto ride-hailing marketplace simulator and policy testbed."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [
  {name = "Fatemeh Sadeghi"}
]
dependencies = [
  "osmnx>=2.1.1,<2.2",
  "networkx>=3.4,<4",
  "pandas>=2.2,<3",
  "geopandas>=1.0,<2",
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "shapely>=2.0,<3",
  "pyarrow>=18,<23",
  "scikit-learn>=1.5,<2",
  "h3>=4.1,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
visualization = [
  "matplotlib>=3.9,<4",
  "plotly>=6,<7",
  "streamlit>=1.48,<2",
  "pydeck>=0.9,<1",
]
optimization = [
  "ortools>=9.12,<10",
]
all = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "matplotlib>=3.9,<4",
  "plotly>=6,<7",
  "streamlit>=1.48,<2",
  "pydeck>=0.9,<1",
  "ortools>=9.12,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
