name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests examples scripts dashboard
      - name: Pytest
        run: pytest --cov=toronto_rideshare --cov-report=xml --junitxml=results/tests.xml
      - name: Verify required runtime paths
        run: |
          pytest tests/test_dashboard_app.py
          pytest tests/test_optimization.py tests/test_matching_routing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-validation
          path: |
            results/tests.xml
            coverage.xml
